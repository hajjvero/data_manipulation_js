<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .hidden {
            display: none;
        }
    </style>
    <script type="module" src="app.js" defer></script>
</head>
<body>
<button id="btn">Toggle</button>
<div id="employees-container">
    <form id="employee-form">
        <div id="form-fields">
            <input id="input-firstName" type="text" name="firstName" placeholder="Prénom" required>
            <input id="input-lastName" type="text" name="lastName" placeholder="Nom" required>
            <input id="input-age" type="number" name="age" placeholder="Âge" min="18" max="65">
            <select id="input-department" name="department">
                <option value="">Choisir un département</option>
                <option value="Développement">Développement</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Management">Management</option>
            </select>
        </div>
        <div id="skills-container">

        </div>
        <button type="button" id="add-skill-btn">+ Compétence</button>

        <button type="submit">Ajouter l'employé</button>
    </form>

    <table id="employees-table">
        <thead>
        <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Département</th>
            <th>Poste</th>
            <th>Salaire</th>
            <th>Skills</th>
            <th>Join Date</th>
            <th>Email</th>
            <th>Projects</th>
            <th>Is Active</th>
            <th>Languages</th>
        </tr>
        </thead>
        <tbody id="employees-tbody">
        <!-- Les employés seront insérés ici dynamiquement -->
        </tbody>
    </table>
</div>
</body>
</html>
