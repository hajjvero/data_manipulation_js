<!DOCTYPE html>
<html lang="en">
<head>

    <title>Title</title>
    <style>
        .hidden {

        }
    </style>
    <script type="module" src="app.js" defer></script>
</head>
<body>
<button id="btn">Toggle</button>
<div id="employees-container">

            <th>Nom</th>
            <th>Prénom</th>
            <th>Département</th>
            <th>Poste</th>

        <tbody id="employees-tbody">

        </tbody>
    </table>
</div>
</body>
</html>
